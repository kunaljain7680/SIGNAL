name: SIGNAL scheduled ingestion

on:
  schedule:
    # 03:23 UTC daily; avoid the top-of-hour scheduling queue.
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-scheduled-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run scheduled source ingestion
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.SIGNAL_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.SIGNAL_GITHUB_TOKEN }}
        run: python scripts/run_ingestion.py --source all
