<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SIGNAL — Technology Intelligence</title>
<style>
:root{--bg:#0b0e13;--panel:#11151d;--panel2:#151a23;--line:#252c38;--text:#eef2f7;--muted:#8d97a8;--accent:#b9ff4a;--accent2:#7dd3fc;--warn:#f8b84a;--danger:#fb7185;--shadow:0 18px 60px rgba(0,0,0,.28)}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 70% -10%,#18212d 0,transparent 35%),var(--bg);color:var(--text)}
button,input{font:inherit} button{cursor:pointer}.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:rgba(10,13,18,.92);backdrop-filter:blur(18px);padding:22px 16px}.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.18em;font-size:15px;margin:6px 8px 28px}.logo-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 20px rgba(185,255,74,.45)}.nav{display:flex;flex-direction:column;gap:4px}.nav button{background:none;border:0;color:#aeb6c3;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:11px;align-items:center}.nav button.active,.nav button:hover{background:#171d27;color:#fff}.nav .icon{width:18px;opacity:.8}.bottom{position:absolute;bottom:18px;left:16px;right:16px}.profile-mini{padding:12px;border:1px solid var(--line);border-radius:12px;background:#10141b}.avatar{width:30px;height:30px;border-radius:9px;background:#202734;display:grid;place-items:center;font-size:12px;font-weight:700}.row{display:flex;gap:10px;align-items:center}.main{min-width:0}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(11,14,19,.72);backdrop-filter:blur(18px);position:sticky;top:0;z-index:10}.search{width:360px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#0e1218;border-radius:11px;padding:9px 12px;color:var(--muted)}.search input{background:none;border:0;outline:0;color:#fff;width:100%}.top-actions{display:flex;gap:8px}.top-actions button,.seg button{background:#131821;color:#aeb6c3;border:1px solid var(--line);border-radius:9px;padding:8px 11px}.content{padding:32px 34px 60px;max-width:1450px;margin:auto}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#7e899a}.title{font-size:32px;letter-spacing:-.035em;margin:8px 0 10px}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.hero-grid{grid-template-columns:1.4fr .8fr;margin-top:24px}.card{background:linear-gradient(180deg,rgba(20,25,34,.98),rgba(14,18,24,.98));border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.pad{padding:20px}.summary{min-height:225px;display:flex;flex-direction:column;justify-content:space-between}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 9px;border:1px solid var(--line);border-radius:99px;color:#b6bfcd;font-size:12px;background:#0f141b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:12px;background:#10141b}.stat b{display:block;font-size:22px;margin:3px 0}.recommendation{border-color:#39492e;background:linear-gradient(145deg,#151d16,#11161a 60%)}.signal-score{font-size:52px;font-weight:750;letter-spacing:-.05em}.signal-score small{font-size:15px;color:#9ca8b8;font-weight:500}.bar{height:7px;border-radius:99px;background:#232a35;overflow:hidden}.bar > i{display:block;height:100%;background:linear-gradient(90deg,#8bbd33,var(--accent));width:87%;border-radius:99px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.metric{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#10151b}.metric b{display:block;font-size:15px}.metric span{font-size:11px;color:var(--muted)}.btn-primary{border:0;padding:10px 13px;border-radius:10px;background:var(--accent);color:#0b0e13;font-weight:700}.btn-secondary{border:1px solid var(--line);padding:10px 13px;border-radius:10px;background:#151a22;color:#e7ecf3}.section-head{display:flex;justify-content:space-between;align-items:end;margin:30px 0 12px}.section-head h2{margin:0;font-size:18px}.section-head span{font-size:12px;color:var(--muted)}.radar-grid{grid-template-columns:repeat(4,1fr)}.radar-card{min-height:160px;padding:16px}.badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:5px 8px;border:1px solid var(--line);display:inline-block;color:#aeb7c3}.score-line{display:flex;justify-content:space-between;margin:12px 0}.score-line b{font-size:22px}.trend.up{color:var(--accent)}.trend.down{color:var(--danger)}.trend.flat{color:var(--warn)}.radar-card button{width:100%;margin-top:12px}.split{grid-template-columns:1.15fr .85fr}.chart{height:370px;position:relative;overflow:hidden}.axis{position:absolute;color:#667084;font-size:10px}.axis.x{bottom:10px;left:50%;transform:translateX(-50%)}.axis.y{left:8px;top:50%;transform:rotate(-90deg) translateX(50%)}.plot{position:absolute;inset:38px 34px 36px 42px;border-left:1px solid #343b48;border-bottom:1px solid #343b48}.quad{position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.9%,#252b36 50%,transparent 50.1%),linear-gradient(0deg,transparent 49.9%,#252b36 50%,transparent 50.1%)}.point{position:absolute;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.55);border-radius:50%;width:12px;height:12px;background:var(--accent);box-shadow:0 0 0 5px rgba(185,255,74,.07);transition:.2s}.point:hover{transform:translate(-50%,-50%) scale(1.5)}.point span{position:absolute;left:15px;top:-5px;white-space:nowrap;color:#cbd2dd;font-size:11px}.evidence{display:grid;gap:10px}.e-card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#10151b}.e-card:hover{border-color:#3b4555}.e-top{display:flex;justify-content:space-between}.side-stack{display:grid;gap:16px}.list{display:grid;gap:8px}.list-item{padding:12px;border:1px solid var(--line);border-radius:11px;background:#10151b;display:flex;justify-content:space-between;gap:12px}.detail{display:none}.detail.active{display:block}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.back{background:none;border:0;color:#aeb6c3}.tabs{display:flex;gap:6px}.tabs button{border:0;background:none;color:#8f9bad;padding:8px 10px;border-bottom:2px solid transparent}.tabs button.active{color:#fff;border-color:var(--accent)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:12px}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}.drawer.open{display:block}.drawer-panel{position:absolute;right:0;top:0;height:100%;width:min(520px,92vw);background:#0d1117;border-left:1px solid var(--line);padding:24px;overflow:auto}.close{float:right;background:#151a22;color:#bbc4d1;border:1px solid var(--line);border-radius:9px;padding:6px 9px}.toast{position:fixed;right:24px;bottom:24px;display:none;background:#eaf7d2;color:#10150b;padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:30}.toast.show{display:block}.profile-grid{grid-template-columns:1fr 1fr}.form-row{display:grid;gap:8px;margin-bottom:14px}.form-row label{font-size:12px;color:#9ba6b6}.form-row input,.form-row select{border:1px solid var(--line);background:#0f141b;color:#fff;border-radius:10px;padding:10px;outline:0}.modal{position:fixed;inset:0;display:none;background:rgba(0,0,0,.55);z-index:25;align-items:center;justify-content:center}.modal.open{display:flex}.modal-panel{width:min(620px,92vw);background:#11161e;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
@media(max-width:1000px){.app{grid-template-columns:76px 1fr}.sidebar{padding:18px 10px}.logo span,.nav button span,.profile-mini .details{display:none}.logo{justify-content:center}.nav button{justify-content:center}.hero-grid,.split,.profile-grid{grid-template-columns:1fr}.radar-grid{grid-template-columns:repeat(2,1fr)}.search{width:280px}.content{padding:24px 18px}}
@media(max-width:640px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;border-top:1px solid var(--line);border-right:0;padding:8px;z-index:15}.nav{flex-direction:row;justify-content:space-around}.nav button{padding:9px}.nav button:nth-child(n+6){display:none}.logo,.bottom{display:none}.topbar{padding:0 14px}.search{width:55vw}.stats,.metrics,.radar-grid{grid-template-columns:1fr}.content{padding-bottom:100px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo"><i class="logo-dot"></i><span>SIGNAL</span></div>
  <nav class="nav" id="nav"></nav>
  <div class="bottom"><div class="profile-mini"><div class="row"><div class="avatar">KJ</div><div class="details"><b style="font-size:12px">Kunal</b><div class="muted" style="font-size:11px">AI Platform</div></div></div></div></div>
</aside>
<main class="main">
<header class="topbar"><div class="search">⌕ <input id="searchInput" placeholder="Search technologies, domains, evidence…" /></div><div class="top-actions"><button id="rangeBtn">90 days</button><button id="notifBtn">◌</button><button>KJ</button></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div class="drawer" id="drawer"><div class="drawer-panel"><button class="close" id="closeDrawer">Close</button><div id="drawerContent"></div></div></div>
<div class="modal" id="modal"><div class="modal-panel" id="modalContent"></div></div>
<div class="toast" id="toast"></div>
<script>
const technologies={
  'AI Inference Infrastructure':{score:87,trend:18,relevance:92,tag:'Strong signal',status:'learn',reason:'High momentum, strong evidence, and close adjacency to Python/FastAPI/LLM experience.',metrics:[['Jobs','+38%'],['Open source','+29%'],['Industry','+21%'],['Community','+17%']],desc:'The systems layer for serving and optimizing foundation-model inference at production scale.',steps:['Model serving concepts','vLLM / serving patterns','GPU inference basics','Latency, batching & quantization']},
  'Agent Observability':{score:78,trend:11,relevance:84,tag:'Emerging',status:'watch',reason:'Strong platform relevance, but evidence is earlier than inference infrastructure.',metrics:[['Jobs','+19%'],['Open source','+24%'],['Industry','+12%'],['Community','+31%']],desc:'Tracing, evaluation and operations for AI-agent workflows.',steps:['OpenTelemetry basics','Trace agent runs','Evaluation patterns','Production guardrails']},
  'MCP':{score:71,trend:26,relevance:77,tag:'Emerging',status:'watch',reason:'High momentum and discussion; adoption evidence is still developing.',metrics:[['Jobs','+8%'],['Open source','+41%'],['Industry','+10%'],['Community','+55%']],desc:'A protocol layer for connecting models with tools and contextual systems.',steps:['Protocol concepts','Tool contracts','Security boundaries','Build a small server']},
  'vLLM':{score:82,trend:20,relevance:90,tag:'Strong signal',status:'learn',reason:'Directly connected to the inference infrastructure path and practical serving skills.',metrics:[['Jobs','+26%'],['Open source','+34%'],['Industry','+18%'],['Community','+27%']],desc:'An inference and serving engine oriented around efficient LLM execution.',steps:['Serving architecture','Continuous batching','KV cache','Benchmark a model']},
  'Rust':{score:68,trend:7,relevance:58,tag:'Watch',status:'watch',reason:'Technical depth is valuable, but it is not the highest marginal value for the current career goal.',metrics:[['Jobs','+12%'],['Open source','+15%'],['Industry','+7%'],['Community','+13%']],desc:'A systems programming language focused on performance and safety.',steps:['Ownership model','Async Rust','Build a service','Interop basics']},
  'WebAssembly':{score:55,trend:3,relevance:41,tag:'Later',status:'later',reason:'Interesting ecosystem, but low immediate relevance for the current target role.',metrics:[['Jobs','+4%'],['Open source','+10%'],['Industry','+3%'],['Community','+8%']],desc:'A portable compilation target for running code in constrained environments.',steps:['Runtime model','WASI','Component model','Tiny service demo']},
  'Vector Databases':{score:63,trend:2,relevance:64,tag:'Later',status:'later',reason:'Already adjacent to current knowledge; depth here is useful but not urgent.',metrics:[['Jobs','+5%'],['Open source','+9%'],['Industry','+6%'],['Community','+11%']],desc:'Datastores and indexes optimized for semantic/vector retrieval workflows.',steps:['Indexing','ANN algorithms','Filtering','Performance tradeoffs']},
  'Kubernetes':{score:79,trend:5,relevance:81,tag:'Mature',status:'watch',reason:'Strong adoption signal, but the broad platform surface makes it a longer path than inference-specific skills.',metrics:[['Jobs','+17%'],['Open source','+12%'],['Industry','+14%'],['Community','+8%']],desc:'The dominant container orchestration platform for production infrastructure.',steps:['Core objects','Networking','Scheduling','Production patterns']},
  'Edge AI':{score:57,trend:14,relevance:48,tag:'Emerging',status:'later',reason:'Momentum is interesting, but the user\'s current path points more strongly to server-side AI platform work.',metrics:[['Jobs','+3%'],['Open source','+13%'],['Industry','+16%'],['Community','+22%']],desc:'AI workloads optimized for inference near devices and users.',steps:['Edge runtimes','Quantization','Model constraints','Deployment']},
  'Data Contracts':{score:61,trend:6,relevance:54,tag:'Watch',status:'watch',reason:'Useful distributed-systems concept, but not yet a top learning priority.',metrics:[['Jobs','+6%'],['Open source','+8%'],['Industry','+11%'],['Community','+5%']],desc:'Explicit contracts that govern data interfaces across producers and consumers.',steps:['Schema evolution','Ownership','Compatibility','Governance']},
  'OpenTelemetry':{score:73,trend:9,relevance:80,tag:'Watch',status:'watch',reason:'High leverage for platform engineering and a strong bridge into observability.',metrics:[['Jobs','+15%'],['Open source','+22%'],['Industry','+19%'],['Community','+9%']],desc:'Open instrumentation and telemetry standards for traces, metrics and logs.',steps:['Tracing model','Collectors','Context propagation','Instrument a service']},
};
let profile={name:'Kunal',goal:'Backend / AI Platform Engineer',experience:'1 year',skills:['Python','FastAPI','PostgreSQL','React','LangGraph','Azure'],interests:['AI Infrastructure','Distributed Systems','Backend'],learning:['AI Inference Infrastructure','vLLM'],watch:['Agent Observability','MCP','Kubernetes','Rust'],saved:['OpenTelemetry']};
const pages={overview:'Overview',radar:'My Radar',trends:'Trends',learn:'Learn Next',evidence:'Evidence',saved:'Saved',profile:'Profile',settings:'Settings',weekly:'Weekly Signal'};
const navItems=[['overview','◫'],['radar','◎'],['trends','◈'],['learn','↗'],['evidence','◌'],['saved','☆'],['weekly','◷'],['profile','◯'],['settings','⚙']];
let current='overview';
const nav=document.getElementById('nav');
nav.innerHTML=navItems.map(([key,ic])=>`<button data-page="${key}"><span class="icon">${ic}</span><span>${pages[key]}</span></button>`).join('');
nav.addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b){current=b.dataset.page;render();}});
function techCard(name){const t=technologies[name]; return `<div class="card radar-card"><div class="badge">${t.tag}</div><h3 style="margin:10px 0 4px;font-size:16px">${name}</h3><div class="score-line"><b>${t.score}</b><span class="trend ${t.trend>=10?'up':t.trend>0?'flat':'down'}">↗ ${t.trend}</span></div><div class="muted" style="font-size:12px">${t.relevance}% personal relevance</div><button class="btn-secondary" onclick="openTech('${name}')">Explore</button></div>`}
function dashboard(){return `<div class="eyebrow">Overview · Updated 2 minutes ago</div><div class="hero-grid grid"><div class="card pad summary"><div><div class="title">What should I pay attention to?</div><div class="muted">Good morning, ${profile.name}. Your technology landscape changed this week.</div></div><div class="stats"><div class="stat"><span class="muted">Strong signals</span><b>3</b><span class="muted">↑ this week</span></div><div class="stat"><span class="muted">More relevant</span><b>2</b><span class="muted">for your goal</span></div><div class="stat"><span class="muted">Weakened</span><b>1</b><span class="muted">trend</span></div></div><div><div class="chips">${profile.skills.map(s=>`<span class="chip">${s}</span>`).join('')}</div><div class="muted" style="font-size:11px;margin-top:10px">${profile.goal} · ${profile.experience}</div></div></div><div class="card pad recommendation"><div class="eyebrow">🔥 Learn Next</div><h2 style="margin:7px 0 6px">AI Inference Infrastructure</h2><div class="row" style="justify-content:space-between"><div class="signal-score">87 <small>/100</small></div><span class="trend up">↗ +18</span></div><div class="bar"><i></i></div><div class="metrics">${technologies['AI Inference Infrastructure'].metrics.map(m=>`<div class="metric"><b>${m[1]}</b><span>${m[0]}</span></div>`).join('')}</div><div class="muted" style="font-size:12px;line-height:1.5">${technologies['AI Inference Infrastructure'].reason}</div><button class="btn-primary" style="margin-top:14px" onclick="openTech('AI Inference Infrastructure')">Explore Signal →</button></div></div><div class="section-head"><h2>Your Technology Radar</h2><span>Personalized for ${profile.goal}</span></div><div class="radar-grid grid">${['AI Inference Infrastructure','Agent Observability','MCP','vLLM'].map(techCard).join('')}</div><div class="section-head"><h2>Trend vs Hype</h2><span>Adoption evidence × momentum</span></div>${trendChart()}<div class="section-head"><h2>Why Signal recommends this</h2><span>Evidence is inspectable</span></div><div class="split grid"><div class="card pad"><div class="eyebrow">Personal signal</div><div style="display:flex;justify-content:center;gap:16px;align-items:center;flex-wrap:wrap;padding:26px 0"><div class="chip">Your profile</div><span>+</span><div class="chip">Technology growth</div><span>+</span><div class="chip">Job demand</div><span>+</span><div class="chip">Skill adjacency</div><span>+</span><div class="chip">Learning effort</div><span>→</span><strong style="color:var(--accent)">87 Signal</strong></div></div><div class="card pad"><div class="evidence">${['Job Market','Open Source','Industry','Community'].map((x,i)=>`<div class="e-card" onclick="openEvidence('${x}')"><div class="e-top"><b>${x}</b><span>${['+38%','+29%','+21%','+17%'][i]}</span></div><div class="muted" style="font-size:11px;margin-top:6px">Evidence supporting AI Inference Infrastructure</div></div>`).join('')}</div></div></div>`}
function trendChart(){const pts=[['AI Inference Infrastructure',82,20],['MCP',73,27],['Kubernetes',61,72],['Rust',54,64],['WebAssembly',38,57],['Agent Observability',67,72],['Vector Databases',52,70],['OpenTelemetry',60,79]];return `<div class="card pad chart"><div class="axis x">Evidence of Adoption</div><div class="axis y">Momentum</div><div class="plot"><div class="quad"></div>${pts.map(p=>`<button class="point" style="left:${p[1]}%;top:${100-p[2]}%" title="${p[0]}" onclick="openTech('${p[0]}')"><span>${p[0]}</span></button>`).join('')}</div></div>`}
function radarPage(){return `<div class="eyebrow">My Radar</div><div class="title">Your Technology Radar</div><div class="muted">A practical ranking of what deserves attention now, later, or not at all.</div><div class="section-head"><h2>🔥 Learn Now</h2><span>High evidence · high relevance</span></div><div class="radar-grid grid">${['AI Inference Infrastructure','vLLM','OpenTelemetry'].map(techCard).join('')}</div><div class="section-head"><h2>👀 Watch</h2><span>Interesting, not yet urgent</span></div><div class="radar-grid grid">${['Agent Observability','MCP','Kubernetes','Rust'].map(techCard).join('')}</div><div class="section-head"><h2>⏳ Later</h2><span>Useful, lower marginal value</span></div><div class="radar-grid grid">${['WebAssembly','Vector Databases','Edge AI','Data Contracts'].map(techCard).join('')}</div>`}
function learnPage(){return `<div class="eyebrow">Learn Next</div><div class="title">What should you learn next?</div><div class="muted">Recommendations balance signal strength, personal fit, and learning effort.</div><div style="margin-top:20px" class="grid">${profile.learning.map(n=>{const t=technologies[n];return `<div class="card pad recommendation"><div class="row" style="justify-content:space-between"><div><div class="badge">Recommended</div><h2 style="margin:10px 0">${n}</h2><div class="muted">${t.desc}</div></div><div class="signal-score" style="font-size:40px">${t.score}<small>/100</small></div></div><div class="metrics">${t.metrics.map(m=>`<div class="metric"><b>${m[1]}</b><span>${m[0]}</span></div>`).join('')}</div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="e-card"><b>Why you</b><div class="muted" style="font-size:12px;margin-top:6px">${t.relevance}% relevance based on your target role and current skills.</div></div><div class="e-card"><b>Suggested path</b><div class="muted" style="font-size:12px;margin-top:6px">${t.steps.slice(0,3).join(' · ')}</div></div></div><button class="btn-primary" style="margin-top:14px" onclick="openTech('${n}')">Explore why →</button></div>`}).join('')}</div>`}
function trendsPage(){return `<div class="eyebrow">Trends</div><div class="title">Momentum without the noise</div><div class="muted">Technologies are positioned by adoption evidence and momentum.</div><div style="margin-top:18px">${trendChart()}</div><div class="section-head"><h2>Recent movement</h2><span>90 day lens</span></div><div class="card"><table class="table"><thead><tr><th>Technology</th><th>Signal</th><th>Momentum</th><th>Read</th></tr></thead><tbody>${Object.entries(technologies).slice(0,8).map(([n,t])=>`<tr><td><button style="background:none;border:0;color:#fff" onclick="openTech('${n}')">${n}</button></td><td>${t.score}</td><td class="trend up">↗ ${t.trend}</td><td>${t.tag}</td></tr>`).join('')}</tbody></table></div>`}
function evidencePage(){return `<div class="eyebrow">Evidence Explorer</div><div class="title">Inspect the signal</div><div class="muted">Recommendations are only useful when you can see the evidence underneath them.</div><div class="section-head"><h2>AI Inference Infrastructure</h2><span>Signal 87/100</span></div><div class="grid evidence">${['Job Market','Open Source','Industry','Community'].map(x=>`<div class="card pad e-card" onclick="openEvidence('${x}')"><div class="e-top"><div><div class="eyebrow">Evidence source</div><h3 style="margin:5px 0">${x}</h3></div><div class="trend up">Strong</div></div><div class="muted">New activity has increased relative to the previous 90-day baseline. This is mock evidence for the interface prototype.</div><div style="margin-top:13px"><span class="badge">Click to inspect</span></div></div>`).join('')}</div>`}
function savedPage(){return `<div class="eyebrow">Saved</div><div class="title">Watchlist</div><div class="muted">Technologies you are actively monitoring.</div><div class="section-head"><h2>Watching</h2><span>${profile.watch.length} technologies</span></div><div class="list">${profile.watch.map(n=>`<div class="list-item"><div><b>${n}</b><div class="muted" style="font-size:11px;margin-top:4px">Last meaningful change: today</div></div><div><span class="badge">${technologies[n].score}</span> <button class="btn-secondary" onclick="openTech('${n}')">Open</button></div></div>`).join('')}</div><div class="section-head"><h2>Saved evidence</h2></div><div class="list">${profile.saved.map(n=>`<div class="list-item"><div><b>${n}</b><div class="muted" style="font-size:11px;margin-top:4px">Saved source / technology note</div></div><button class="btn-secondary" onclick="openTech('${n}')">Open</button></div>`).join('')}</div>`}
function weeklyPage(){return `<div class="eyebrow">Weekly Signal</div><div class="title">Your weekly intelligence briefing</div><div class="muted">7 meaningful changes this week.</div><div class="grid" style="grid-template-columns:repeat(4,1fr);margin-top:22px"><div class="card pad"><div class="eyebrow">🔥 Emerging</div><div style="font-size:30px;font-weight:700;margin-top:10px">2</div><div class="muted">technologies gained momentum</div></div><div class="card pad"><div class="eyebrow">📈 Career Market</div><div style="font-size:30px;font-weight:700;margin-top:10px">3</div><div class="muted">technologies increased in relevant job postings</div></div><div class="card pad"><div class="eyebrow">⚠️ Hype Watch</div><div style="font-size:30px;font-weight:700;margin-top:10px">1</div><div class="muted">technology has rising discussion but weak adoption evidence</div></div><div class="card pad recommendation"><div class="eyebrow">🎯 Personal</div><div style="font-size:30px;font-weight:700;margin-top:10px">1</div><div class="muted">new learning recommendation</div></div></div><div class="section-head"><h2>This week's changes</h2><span>Compared with last week</span></div><div class="list">${[['AI Inference Infrastructure','Crossed your Learn threshold'],['vLLM','Gained a significant job-market signal'],['Rust','Activity increased, hiring demand unchanged'],['MCP','Community momentum accelerated']].map(x=>`<div class="list-item"><div><b>${x[0]}</b><div class="muted" style="font-size:11px;margin-top:4px">${x[1]}</div></div><span class="trend up">→</span></div>`).join('')}</div>`}
function profilePage(){return `<div class="eyebrow">Profile</div><div class="title">My Profile</div><div class="muted">Changing your profile changes your recommendations.</div><div class="profile-grid grid" style="margin-top:20px"><div class="card pad"><div class="section-head" style="margin-top:0"><h2>Career context</h2></div><div class="form-row"><label>Name</label><input id="pname" value="${profile.name}"></div><div class="form-row"><label>Career target</label><input id="pgoal" value="${profile.goal}"></div><div class="form-row"><label>Experience</label><input id="pexp" value="${profile.experience}"></div><button class="btn-primary" onclick="saveProfile()">Save profile</button></div><div class="card pad"><div class="section-head" style="margin-top:0"><h2>Skills & interests</h2></div><div class="eyebrow">Current skills</div><div class="chips" style="margin:10px 0 18px">${profile.skills.map(s=>`<span class="chip">${s}</span>`).join('')}</div><div class="eyebrow">Interests</div><div class="chips" style="margin-top:10px">${profile.interests.map(s=>`<span class="chip">${s}</span>`).join('')}</div></div><div class="card pad"><div class="section-head" style="margin-top:0"><h2>Currently learning</h2></div><div class="chips">${profile.learning.map(s=>`<span class="chip">${s}</span>`).join('')}</div></div><div class="card pad"><div class="section-head" style="margin-top:0"><h2>Ignored / lower priority</h2></div><div class="chips"><span class="chip">WebAssembly</span><span class="chip">Edge AI</span></div></div></div>`}
function settingsPage(){return `<div class="eyebrow">Settings</div><div class="title">System preferences</div><div class="muted">Control how Signal updates and communicates.</div><div class="grid" style="margin-top:20px;max-width:760px"><div class="card pad"><div class="list"><div class="list-item"><div><b>Weekly digest</b><div class="muted" style="font-size:11px">Monday morning briefing</div></div><button class="btn-secondary" onclick="toast('Weekly digest setting toggled')">On</button></div><div class="list-item"><div><b>Threshold alerts</b><div class="muted" style="font-size:11px">Notify when a technology crosses your Learn threshold</div></div><button class="btn-secondary" onclick="toast('Threshold alerts setting toggled')">On</button></div><div class="list-item"><div><b>Evidence detail</b><div class="muted" style="font-size:11px">Show source-level evidence by default</div></div><button class="btn-secondary" onclick="toast('Evidence detail preference toggled')">On</button></div></div></div></div>`}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===current));const c=document.getElementById('content');c.innerHTML=current==='overview'?dashboard():current==='radar'?radarPage():current==='trends'?trendsPage():current==='learn'?learnPage():current==='evidence'?evidencePage():current==='saved'?savedPage():current==='weekly'?weeklyPage():current==='profile'?profilePage():settingsPage();}
function openTech(name){const t=technologies[name];document.getElementById('drawerContent').innerHTML=`<div class="eyebrow">Technology detail</div><h1 style="font-size:30px;letter-spacing:-.035em;margin:8px 0">${name}</h1><div class="row" style="gap:16px"><div class="signal-score" style="font-size:44px">${t.score}<small>/100</small></div><div><span class="badge">${t.tag}</span><div class="trend up" style="margin-top:8px">↗ +${t.trend} over 90 days</div></div></div><div class="section-head"><h2>Overview</h2></div><div class="muted" style="line-height:1.6">${t.desc}</div><div class="section-head"><h2>Why you should care</h2></div><div class="card pad"><div class="muted">${t.reason}</div></div><div class="section-head"><h2>Signal breakdown</h2></div><div class="metrics">${t.metrics.map(m=>`<div class="metric"><b>${m[1]}</b><span>${m[0]}</span></div>`).join('')}</div><div class="section-head"><h2>What you should learn</h2></div><div class="list">${t.steps.map((s,i)=>`<div class="list-item"><div><span class="badge">${i+1}</span> <b>${s}</b></div><span class="muted">Next</span></div>`).join('')}</div><div class="section-head"><h2>Related evidence</h2></div><div class="list">${['Job Market','Open Source','Industry','Community'].map(x=>`<button class="list-item" style="text-align:left;color:#fff" onclick="openEvidence('${x}')"><span><b>${x}</b><div class="muted" style="font-size:11px;margin-top:4px">Inspect source-level context</div></span><span>→</span></button>`).join('')}</div><div style="margin-top:18px;display:flex;gap:8px"><button class="btn-primary" onclick="saveTech('${name}')">${profile.watch.includes(name)?'Watching ✓':'Add to Watch'}</button><button class="btn-secondary" onclick="toast('Recommendation reasoning opened')">Why Signal? ↗</button></div>`;document.getElementById('drawer').classList.add('open');}
function openEvidence(src){document.getElementById('drawerContent').innerHTML=`<div class="eyebrow">Evidence detail</div><h2>${src}</h2><div class="muted">AI Inference Infrastructure · Signal 87/100</div><div class="card pad" style="margin-top:16px"><div class="e-top"><b>${src} signal</b><span class="trend up">strong</span></div><p class="muted" style="line-height:1.6">This prototype uses fictional evidence to demonstrate how Signal could explain the provenance of a recommendation without turning into a news feed.</p><div class="bar"><i style="width:${src==='Community'?72:src==='Job Market'?88:src==='Open Source'?82:76}%"></i></div></div><div class="section-head"><h2>Timeline</h2><span>May → Aug</span></div><div class="card pad"><div class="muted">May · baseline</div><div style="height:2px;background:#2a313d;margin:10px 0"></div><div class="muted">Jun · early movement</div><div style="height:2px;background:#2a313d;margin:10px 0"></div><div class="muted">Jul · adoption signals</div><div style="height:2px;background:#2a313d;margin:10px 0"></div><div style="color:var(--accent)">Aug · acceleration</div></div><div class="section-head"><h2>Reliability</h2></div><div class="row" style="justify-content:space-between"><span class="muted">Source confidence</span><b>${src==='Community'?'Medium':'High'}</b></div>`;document.getElementById('drawer').classList.add('open');}
function saveTech(name){if(!profile.watch.includes(name))profile.watch.push(name);toast(name+' added to your watchlist');}
function saveProfile(){profile.name=document.getElementById('pname').value||profile.name;profile.goal=document.getElementById('pgoal').value||profile.goal;profile.experience=document.getElementById('pexp').value||profile.experience;toast('Profile updated — recommendations recalculated');render();}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
document.getElementById('closeDrawer').onclick=()=>document.getElementById('drawer').classList.remove('open');
document.getElementById('notifBtn').onclick=()=>{document.getElementById('modalContent').innerHTML=`<div class="row" style="justify-content:space-between"><h2>Notifications</h2><button class="close" onclick="document.getElementById('modal').classList.remove('open')">Close</button></div><div class="list" style="margin-top:14px"><div class="list-item"><span>🔥 AI Inference crossed your Learn threshold.</span><span>Now</span></div><div class="list-item"><span>📈 vLLM gained a significant job-market signal.</span><span>12m</span></div><div class="list-item"><span>⚠️ Rust activity increased, but hiring demand hasn't changed.</span><span>1h</span></div><div class="list-item"><span>🎯 Your recommendation changed after a profile update.</span><span>2h</span></div></div>`;document.getElementById('modal').classList.add('open')};
document.getElementById('rangeBtn').onclick=()=>toast('Time range switched to 30 days');
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim().toLowerCase();const hit=Object.keys(technologies).find(n=>n.toLowerCase().includes(q)); if(hit)openTech(hit); else toast('No matching technology found')}});
render();
</script>
</body>
</html>
